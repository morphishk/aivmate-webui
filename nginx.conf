server {
    listen 8080;
    server_name _;

    # 主页 - Web 聊天页（5260）
    location / {
        proxy_pass http://aivmate-webui:5260/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    # 兼容旧路径 /state/ → 5260
    location /state/ {
        proxy_pass http://aivmate-webui:5260/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Live2D（5261）
    location /live2d/ {
        proxy_pass http://aivmate-webui:5261/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # MMD（5262）
    location /mmd/ {
        proxy_pass http://aivmate-webui:5262/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # VRM（5263）
    location /vrm/ {
        proxy_pass http://aivmate-webui:5263/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # SSE 流式接口（特殊处理）
    location /api/vlm_stream {
        proxy_pass http://aivmate-webui:5260/api/vlm_stream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 兼容旧路径 /state/api/vlm_stream
    location /state/api/vlm_stream {
        proxy_pass http://aivmate-webui:5260/api/vlm_stream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 静态资源由各服务的 /assets/ 路由自行处理，不在这里统一拦截
    # （避免正则匹配覆盖 /live2d/、/mmd/、/vrm/ 的前缀代理）
}
