version: '3.8'

services:
  aivmate-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: aivmate/aivmate-webui
    container_name: aivmate-webui
    environment:
      - HOST_IP=${HOST_IP:-}
    ports:
      #- "5260:5260"
      #- "5261:5261"
      #- "5262:5262"
      #- "5263:5263"
      #- "5250:5250"
      - "3000:3000"
    volumes:
      - ./:/app
    working_dir: /app
    restart: unless-stopped
    networks:
      - aivmate-net

  nginx:
    image: nginx:alpine
    container_name: aivmate-webui-nginx
    ports:
      - "5260:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - aivmate-webui
    networks:
      - aivmate-net

networks:
  aivmate-net:
    driver: bridge
